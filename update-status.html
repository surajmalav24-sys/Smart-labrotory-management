<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusCare - Update Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="form-page">
      <section class="form-shell card-surface card-shadow">
        <div class="modal-head">
          <h3>Update Complaint Status</h3>
          <a class="icon-btn" href="dashboard.html" aria-label="Go back"><i class="fa-solid fa-arrow-left"></i></a>
        </div>
        <p id="status-title" class="status-title"></p>
        <form id="status-form" class="modal-form">
          <label for="complaint-status">Status</label>
          <select id="complaint-status" required>
            <option value="Open">Open</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
          </select>
          <button type="submit" class="primary-btn">Save Status</button>
        </form>
      </section>
    </main>
    <script src="update-status.js"></script>
  </body>
</html>
